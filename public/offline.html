<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101B38">
<title>ProjectTrack: offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         font-family: system-ui, sans-serif; background:#101B38; color:#E8EDF7; text-align:center; }
  main { max-width:380px; }
  h1 { font-size:2rem; margin:0 0 .5rem; letter-spacing:.02em; }
  p  { color:#A0ACC7; line-height:1.5; margin:0 0 1.25rem; }
  button { font:inherit; font-weight:600; padding:.65rem 1.25rem; border:0; border-radius:8px; background:#E8EDF7; color:#101B38; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>ProjectTrack shows live team data, so it needs a connection. Nothing you saved is lost. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
